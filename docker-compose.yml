version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: prognosense_backend
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models:ro
      - ./data/results:/app/data/results:ro
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prognosense_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always