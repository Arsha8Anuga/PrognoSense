# Stack Portainer PrognoSense.
# Deploy: Portainer → Stacks → Add stack → Repository (repo ini, Compose path: docker-compose.yml).
# Variabel di Portainer (Environment variables), semuanya opsional:
#   PORT         port di server yang membuka web (default 8080)
#   CORS_ORIGIN  asal yang diizinkan memanggil API langsung (default *)
# Model (models/v1) dan hasil (data/results) ikut dibangun ke dalam image backend,
# jadi tidak ada bind mount yang bergantung pada folder di server.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      MODEL_DIR: models/v1
      DATA_DIR: data/results
      LOG_DIR: logs
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      - logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  logs:
